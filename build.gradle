plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.3.21'
  // Runtime.File is @Serializable and the codec core declares KSerializers, so
  // the serialization compiler plugin is required here as it is in every
  // generated package. Its version is pinned to the Kotlin version.
  id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.21'
  id 'java-library'
  id 'maven-publish'
}

group = 'com.github.primegraph'
// version comes from gradle.properties, which is what scripts/release.sh bumps.

// A plain Kotlin/JVM library, not com.android.library: this package holds only
// the shared vocabulary and touches no Android API, and a JVM artifact is
// consumable both by the generated Android libraries and by the JVM ones.
// The toolchain and the JVM target match what the generated packages compile
// against, so the class files load there without a downgrade.
kotlin {
  jvmToolchain(17)
  explicitApi()
}

java {
  withSourcesJar()
}

repositories {
  mavenCentral()
}

dependencies {
  // `api`, not `implementation`: kotlinx types stand in this project's PUBLIC
  // signatures — `DslThrow.payloadJson` is a `JsonElement`, `ktJson` is a
  // `Json`, the five serializers are `KSerializer`s — so a consumer that names
  // any of them needs the artifact on its own compile classpath.
  //
  // The version is the one every generated bundle already declares, itself as
  // `api` (scope `compile` in the published poms), so adding this project to a
  // bundle contributes no second kotlinx version to the graph.
  api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.jetbrains.kotlin:kotlin-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}

publishing {
  publications {
    release(MavenPublication) {
      from components.java
      // Kept equal to rootProject.name so that Maven consumers and Gradle
      // source-dependency consumers resolve the same coordinates.
      artifactId = 'primegraph-core-kt'

      pom {
        name.set('primegraph-core-kt')
        description.set('Shared cross-package vocabulary for PrimeGraph generated Kotlin packages')
        url.set('https://github.com/primegraph/primegraph-core-kt')

        licenses {
          license {
            name.set('MIT')
            url.set('https://opensource.org/licenses/MIT')
            distribution.set('repo')
          }
        }

        developers {
          developer {
            id.set('PrimeGraphGenerator')
            name.set('PrimeGraph Generator')
            email.set('generator@primegraph.ai')
          }
        }

        scm {
          connection.set('scm:git:git://github.com/primegraph/primegraph-core-kt.git')
          developerConnection.set('scm:git:ssh://github.com/primegraph/primegraph-core-kt.git')
          url.set('https://github.com/primegraph/primegraph-core-kt')
        }
      }
    }
  }

  repositories {
    maven {
      name = 'GitHubPackages'
      url = uri('https://maven.pkg.github.com/primegraph/primegraph-core-kt')
      credentials {
        username = System.getenv('GITHUB_ACTOR')
        password = System.getenv('GITHUB_TOKEN')
      }
    }
  }
}
